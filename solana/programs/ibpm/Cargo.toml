[package]
name = "ibpm"
version = "0.1.0"
description = "iBlock Prediction Market — collateralized FPMM on Solana"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "ibpm"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []

[dependencies]
anchor-lang = { version = "0.32.1", features = ["init-if-needed"] }
anchor-spl = "0.32.1"
