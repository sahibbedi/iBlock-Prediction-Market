[toolchain]
anchor_version = "0.32.1"
package_manager = "yarn"

[features]
resolution = true
skip-lint = true

[programs.localnet]
ibpm = "EiMn8BEsdfuxEedNGi2vr12cjbKhGpq5Bq5N2ecCdnnM"

[programs.devnet]
ibpm = "EiMn8BEsdfuxEedNGi2vr12cjbKhGpq5Bq5N2ecCdnnM"

[registry]
url = "https://api.apr.dev"

[provider]
cluster = "localnet"
wallet = "~/.config/solana/id.json"

[workspace]
members = ["programs/ibpm"]

[scripts]
test = "yarn run ts-mocha -p ./tsconfig.json -t 1000000 'tests/ibpm.ts'"

[test]
startup_wait = 20000
shutdown_wait = 2000
upgradeable = false
